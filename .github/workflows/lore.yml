# lore-hash: d2db120b151d6ca15172c913877986a4e0187abbff5eb0bb66d90feb981fca1b
# lore install이 설치한 워크플로입니다. 고치면 lore install이 덮어쓰지 않고 lore uninstall이 지우지 않습니다.
name: "lore"

on:
  pull_request:
    types: ["opened", "synchronize", "reopened", "edited"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  check:
    # 닫힌 PR의 설명을 고쳐도 돌지 않습니다.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    env:
      LORE_VERSION: "0.1.0"
      LORE_REPO: "Just-gomin/lore"
    steps:
      # 비교 기준(merge-base)을 찾으려면 전체 이력이 필요합니다.
      - name: "Repository Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # lore 레포가 비공개면 읽을 수 있는 토큰을 LORE_TOKEN 시크릿에 넣습니다.
      # 포크와 Dependabot의 PR에는 시크릿이 넘어가지 않아, 비공개 레포에서는 이 단계가 실패합니다.
      - name: "lore 내려받기"
        env:
          GH_TOKEN: ${{ secrets.LORE_TOKEN || github.token }}
        run: |
          gh release download "v${LORE_VERSION}" --repo "${LORE_REPO}" --pattern "lore-x86_64-unknown-linux-gnu.tar.gz" --dir "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/lore-x86_64-unknown-linux-gnu.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # PR 설명은 셸 명령에 직접 넣지 않고 환경 변수로 받아 파일로 씁니다.
      - name: "lore check"
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          printf '%s\n' "${PR_BODY}" > "${RUNNER_TEMP}/pr-body.md"
          set +e
          lore check --base "origin/${BASE_REF}" --pr-body "${RUNNER_TEMP}/pr-body.md" > "${RUNNER_TEMP}/check.json"
          echo "code=$?" >> "${GITHUB_OUTPUT}"
          lore check --base "origin/${BASE_REF}" --pr-body "${RUNNER_TEMP}/pr-body.md" --for-human > "${RUNNER_TEMP}/check.txt" 2>&1
          cat "${RUNNER_TEMP}/check.txt"

      # PR마다 코멘트 하나를 두고 다시 돌면 고칩니다. 판단이 드는 검사의 기록은 실행마다 이어 붙입니다.
      - name: "PR 코멘트"
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const fs = require("fs");
            const dir = process.env.RUNNER_TEMP;
            // 코멘트 본문은 65536자까지라 출력과 기록의 길이를 묶어 둡니다.
            let text = fs.readFileSync(`${dir}/check.txt`, "utf8").trimEnd();
            if (text.length > 30000) {
              text = `${text.slice(0, 30000)}\n... (잘림)`;
            }
            let result = {};
            try {
              result = JSON.parse(fs.readFileSync(`${dir}/check.json`, "utf8"));
            } catch (error) {
              core.warning(`lore check의 JSON을 읽지 못했습니다: ${error}`);
            }
            const mark = "lore-check-record";
            const findings = {};
            for (const check of result.checks || []) {
              if (!check.blocking && check.findings) {
                findings[check.id] = check.findings;
              }
            }
            const run = {
              sha: context.payload.pull_request.head.sha,
              ok: result.ok === true,
              findings,
            };
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            // 이 워크플로가 쓴 코멘트만 봅니다. 다른 사람이 표식을 흉내 낸 코멘트는 건드리지 않습니다.
            const old = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                (comment.body || "").includes(`<!-- ${mark}\n`),
            );
            let runs = [];
            const recorded = old && old.body.match(new RegExp(`<!-- ${mark}\\n([^\\n]*)\\n-->`));
            if (recorded) {
              try {
                runs = JSON.parse(recorded[1]);
              } catch (error) {
                core.warning(`이전 기록을 읽지 못했습니다: ${error}`);
              }
            }
            runs = runs.filter((previous) => previous.sha !== run.sha);
            runs.push(run);
            // HTML 주석 안에 "--"가 들어가지 않게 합니다.
            const encode = (list) => JSON.stringify(list).replace(/--/g, "-\\u002d");
            // 기록이 길면 오래된 실행부터 뺍니다.
            while (runs.length > 1 && encode(runs).length > 30000) {
              runs.shift();
            }
            const record = encode(runs);
            const body = `### lore check\n\n\`\`\`\`text\n${text}\n\`\`\`\`\n\n<!-- ${mark}\n${record}\n-->\n`;
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: "결과"
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: exit "${CODE}"
